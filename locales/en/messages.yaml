help:
  main: |
    ℹ️ <b>HELP CENTER</b>

    Pick a topic:
  faq_buy: |
    📱 <b>HOW TO BUY A NUMBER</b>

    1. Tap 🛍 Buy Number
    2. Pick a service (or search for it)
    3. Pick a country
    4. Confirm the price
    5. The code arrives here automatically

    <i>Make sure your balance covers the price first.</i>
  faq_payment: |
    💳 <b>PAYMENT HELP</b>

    Add balance from 💳 Balance → ➕ Add Balance.
    Your balance updates automatically once the payment lands — usually within a minute.

    If it does not, contact support with your invoice id.
  faq_no_sms: |
    📩 <b>SMS NOT RECEIVED</b>

    • Wait the full activation window — some services are slow
    • Make sure you requested the code on the right service
    • If nothing arrives, cancel the activation for an automatic refund
  faq_refund: |
    💰 <b>REFUND POLICY</b>

    {refund_policy}
  terms: |
    📄 <b>TERMS OF SERVICE</b>

    {terms}
  privacy: |
    🔐 <b>PRIVACY POLICY</b>

    {privacy}
  support: |
    🆘 <b>SUPPORT</b>

    Need help? Our team can assist you.

    ⏱ Average response time: {response_time}

policies:
  refund: |
    Cancelling an activation before an SMS arrives refunds the full price to your balance automatically.
    Once a code has been delivered the activation is complete and cannot be refunded.
  terms: |
    This service provides virtual numbers for lawful verification and social media marketing services.
    It must not be used for fraud, impersonation, spam, account takeover, or bypassing platform security.
    Accounts used for such purposes are terminated without refund.
  privacy: |
    We store your Telegram id, username, orders and transactions in order to operate the service.
    We do not sell your data. Numbers and received messages are retained only as long as needed to
    show them in your order history.

